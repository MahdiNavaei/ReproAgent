[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reproagent"
version = "0.1.1"
description = "The open-source flight recorder for AI agents: capture failures, replay them, compare executions, and prevent regressions."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Mahdi Navaei" }
]
maintainers = [
  { name = "Mahdi Navaei" }
]
keywords = ["ai", "agents", "debugging", "replay", "regression-testing", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.10,<3",
]

[project.urls]
Homepage = "https://github.com/MahdiNavaei/ReproAgent"
Repository = "https://github.com/MahdiNavaei/ReproAgent"
Issues = "https://github.com/MahdiNavaei/ReproAgent/issues"
Documentation = "https://github.com/MahdiNavaei/ReproAgent#readme"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "openai>=2,<3",
  "pytest>=8.3",
  "ruff>=0.11",
]
openai = [
  "openai>=2,<3",
]
pytest = [
  "pytest>=8.3",
]

[project.scripts]
reproagent = "reproagent.cli.main:main"

[project.entry-points.pytest11]
reproagent = "reproagent.pytest_plugin"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reproagent = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
packages = ["reproagent"]
mypy_path = "src"
